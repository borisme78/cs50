{% extends "layout.html" %}

{% block body %}

<div class="col">
    <form action="/compare" enctype="multipart/form-data" method="post">
        <div>
            <input class="form-control-file" type="file" name="file1"><br>
        </div>
        <p> </p>
        <div>
            <input class="form-control-file" type="file" name="file2"><br>
        </div>
        <div class="form-check">
            <label><input type="radio" name="algorithm" value="lines"> Compare lines</label>
        </div>
        <div class="form-check">
            <label><input type="radio" name="algorithm" value="sentences"> Compare sentences</label>
        </div>
        <div class="form-check">
            <label><input type="radio" name="algorithm" value="substrings"> Compare substrings</label>
            <input type="number" name="n" min="1" placeholder="Length N" class="form-control"
                style="width: 100px; display: inline-block;">
        </div>
        <button type="submit" class="btn btn-primary">Compare</button>


    </form>
</div>

{% endblock %}
