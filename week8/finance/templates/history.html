{% extends "layout.html" %}

{% block title %}
History
{% endblock %}

{% block main %}
<table class="table">
  <thead>
    <tr>
      <th scope="col">Symbol</th>
      <th scope="col">Shares</th>
      <th scope="col">Price</th>
      <th scope="col">Transacted</th>
    </tr>
  </thead>
  <tbody>
    {% for row in transactions %}
        <tr>
            <td class="text-start">{{ row.symbol }}</td>
            <td class="text-end">{{ row.shares }}</td>
            <td class="text-end">${{ "%.2f"|format(row.price) }}</td>
            <td class="text-end">{{ row.transacted }}</td>
        </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
